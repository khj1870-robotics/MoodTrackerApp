name: Build Android APK

on:
  push:
    branches:
      - claude/emotion-app-apk-integration-3joa6u
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK signing certificate and version
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "versionCode|versionName"

      - uses: actions/upload-artifact@v4
        with:
          name: moodtracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
